spring:
  application:
    name: ods-gateway
  profiles:
    default: local
  datasource:
    url: ${ODS_DATABASE_URL:jdbc:h2:file:./.ods-local/gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${ODS_DATABASE_USER:sa}
    password: ${ODS_DATABASE_PASSWORD:}
  flyway:
    enabled: true
server:
  address: ${ODS_BIND_ADDRESS:127.0.0.1}
  port: ${ODS_GATEWAY_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
ods:
  workspace: ${ODS_WORKSPACE:}
  repository: ${ODS_REPOSITORY:}
  embedded: ${ODS_EMBEDDED:false}
  local-token: ${ODS_LOCAL_TOKEN:}
  runtime-directory: ${ODS_RUNTIME_DIRECTORY:}
  python-command: ${ODS_PYTHON_COMMAND:python3.12}
  llm-transport: ${ODS_LLM_TRANSPORT:API}
  vibe-url: ${ODS_VIBE_URL:https://api.mistral.ai/v1}
  vibe-auth: ${ODS_VIBE_AUTH:API_KEY}
  vibe-token: ${ODS_VIBE_TOKEN:}
  data-key: ${ODS_DATA_KEY_BASE64:}
  oidc-issuer: ${ODS_OIDC_ISSUER:}
  oidc-audience: ${ODS_API_AUDIENCE:ods-gateway}
  oidc-client-id: ${ODS_OIDC_CLIENT_ID:ods-vscode}
  gitlab-url: ${ODS_GITLAB_URL:https://gitlab.organisation.example}
  governance-project-id: ${ODS_GOVERNANCE_PROJECT_ID:}
  governance-ref: ${ODS_GOVERNANCE_REF:main}
  governance-token: ${ODS_GOVERNANCE_TOKEN:}
  policy-key: ${ODS_POLICY_PUBLIC_KEY:}
  mistral-url: ${ODS_MISTRAL_URL:https://api.mistral.ai}
  mistral-key: ${ODS_MISTRAL_API_KEY:}
  mistral-model: ${ODS_MISTRAL_MODEL:CHANGE_ME_APPROVED_MISTRAL_MODEL}
  model-alias: ${ODS_MODEL_ALIAS:mistral-coding-approved}
  prompt-directory: ${ODS_PROMPT_DIRECTORY:}
  prompt-key: ${ODS_PROMPT_PUBLIC_KEY:}
  sonar-url: ${ODS_SONAR_URL:https://sonar.organisation.example}
  sonar-token: ${ODS_SONAR_TOKEN:}
  sonar-username: ${ODS_SONAR_USERNAME:}
  jfrog-url: ${ODS_JFROG_URL:https://jfrog.organisation.example}
  jfrog-token: ${ODS_JFROG_TOKEN:}
  jfrog-username: ${ODS_JFROG_USERNAME:}
  jfrog-password: ${ODS_JFROG_PASSWORD:}
  jfrog-auth: ${ODS_JFROG_AUTH:TOKEN}
  jfrog-watch: ${ODS_JFROG_WATCH:}
  jfrog-project-key: ${ODS_JFROG_PROJECT_KEY:}
  runner-project-id: ${ODS_RUNNER_PROJECT_ID:}
  runner-ref: ${ODS_RUNNER_REF:main}
  runner-token: ${ODS_RUNNER_TOKEN:}
