name: Build and package
on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Full validation and standalone delivery
        shell: cmd
        run: script.bat config\organisations\demo\organisation.json
      - name: Publish generated artifacts outside Git history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ods-delivery-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            suiteInstall-*.zip
            .artifacts/*.vsix
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1 # 16.10
        env:
          POSTGRES_DB: ods_test
          POSTGRES_USER: ods_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ods_test -d ods_test" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ODS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ods_test
      ODS_TEST_DATABASE_USER: ods_test
      ODS_TEST_DATABASE_PASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: vscode-extension
      - run: npx playwright install --with-deps chromium
        working-directory: vscode-extension
      - name: Full validation and Linux runtime contract
        run: python tools/build.py --task Vsix --organisation-profile config/organisations/demo/organisation.json
