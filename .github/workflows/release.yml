name: Publish validated release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Require exact stable main commit and version
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          if ($env:GITHUB_REF_NAME -ne "v$($pom.project.version)") { throw 'Tag/version mismatch' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not on main' }
      - name: Validate exact tagged source
        shell: cmd
        run: package.bat
      - name: Publish version-matched artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content suiteInstall/VERSION).Trim()
          $identity = Get-Content suiteInstall/BUILD.json -Raw | ConvertFrom-Json
          if ($identity.sourceDirty -or $identity.sourceCommit -ne (git rev-parse HEAD).Trim()) { throw 'Delivery does not match clean tagged source' }
          gh release create "v$version" "suiteInstall-$version.zip" ".artifacts/organisation-development-standard-$version.vsix" --verify-tag --title "ODS $version" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
